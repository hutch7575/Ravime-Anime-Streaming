name: Build ReAnime Cast APK
on:
  push:
    branches: [build/reanime-cast-android-2026-10]
    paths:
      - 'reanime-cast-android/**'
      - '.github/workflows/reanime-cast-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reanime-cast-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReAnime-Cast-debug-APK
          path: reanime-cast-android/app/build/outputs/apk/debug/app-debug.apk
